apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: vllm-gpu
  region: us-east-1

vpc:
  nat:
    gateway: Disable          # saves ~$1/day; nodes use public subnets instead

iam:
  withOIDC: true              # needed for the EBS CSI driver's IAM role

addons:
  - name: aws-ebs-csi-driver  # lets PVCs get EBS volumes
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  - name: system
    instanceType: m7i-flex.large   # change to t3.small if that's what's eligible
    desiredCapacity: 2
    minSize: 1
    maxSize: 2