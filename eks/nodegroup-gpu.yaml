apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: vllm-gpu
  region: us-east-1

managedNodeGroups:
  - name: gpu
    instanceType: g5.xlarge
    desiredCapacity: 1
    minSize: 0
    maxSize: 1
    volumeSize: 100
    labels:
      workload: gpu
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule